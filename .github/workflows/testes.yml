name: testes

on: [push]

jobs:
  rodar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pytest

      - name: rodar os testes visiveis
        run: |
          set +e
          pytest -q
          codigo=$?
          # 5 = nenhum teste encontrado ainda. Nao e erro no comeco do trimestre.
          if [ $codigo -eq 5 ]; then exit 0; fi
          exit $codigo
